[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

# Per-boot worker units (windmill-worker-N), generated by start.sh — count scales with memory.
[include]
files = /run/windmill/supervisor.d/*.conf

[program:postgresql]
priority=10
command=/usr/lib/postgresql/16/bin/postgres -D /app/pgdata/16
user=cloudron
autostart=true
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Windmill API/UI server (MODE=server): serves HTTP on 127.0.0.1:8001, runs first-boot migrations,
# does NOT process jobs — the worker units do. PORT is set here, never globally, so workers don't
# try to bind it.
[program:windmill-server]
priority=20
command=/bin/bash -c 'until /usr/lib/postgresql/16/bin/pg_isready -h /app/pgdata -p 5432 >/dev/null 2>&1; do echo "==> [windmill] waiting for postgresql"; sleep 1; done; exec /app/code/windmill'
environment=MODE="server",PORT="8001"
user=cloudron
directory=/app/data
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
priority=30
command=/usr/sbin/nginx -c /app/code/nginx.conf -g 'daemon off;'
user=cloudron
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
