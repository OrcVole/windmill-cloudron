[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgresql]
priority=10
command=/usr/lib/postgresql/16/bin/postgres -D /app/data/postgresql/16
user=cloudron
autostart=true
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:windmill]
priority=20
command=/bin/bash -c 'until /usr/lib/postgresql/16/bin/pg_isready -h /run/postgresql -p 5432 >/dev/null 2>&1; do echo "==> [windmill] waiting for postgresql"; sleep 1; done; exec /app/code/windmill'
user=cloudron
directory=/app/data
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
priority=30
command=/usr/sbin/nginx -c /app/code/nginx.conf -g 'daemon off;'
user=cloudron
autostart=true
autorestart=true
startsecs=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
