# Cloudron-facing reverse proxy for Windmill.
# Terminates the platform's plain-HTTP forward on httpPort 8000, answers /health immediately
# (liveness — stays green while Windmill runs first-boot migrations), proxies everything else to
# the Windmill API/UI server process on 127.0.0.1:8001 with websocket upgrade + long timeouts.
# (Workers are separate processes and serve no HTTP; only the server is proxied.)

worker_processes auto;
pid /run/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    # Read-only rootfs: every temp path must live under writable /run.
    client_body_temp_path /run/nginx/body;
    proxy_temp_path       /run/nginx/proxy;
    fastcgi_temp_path     /run/nginx/fastcgi;
    scgi_temp_path        /run/nginx/scgi;
    uwsgi_temp_path       /run/nginx/uwsgi;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    # Windmill scripts/flows and big webhook payloads can be large.
    client_max_body_size 512M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8000 default_server;
        listen [::]:8000 default_server;

        # Liveness: 200 without auth, served by nginx even while the backend warms up.
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 75s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
